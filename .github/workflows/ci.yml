name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur une branche annule l'exécution encore en cours pour cette
# branche, sauf sur main où le déploiement qui suit ne doit pas être interrompu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Pages sert la branche main depuis docs/ : le build de production
      # y écrit le site avec le base href du site publié, le postbuild recopie
      # index.html en 404.html pour les liens profonds, et robots.txt,
      # sitemap.xml et llm.txt suivent comme assets déclarés dans angular.json.
      - name: Build
        run: npm run build

      # Le commit porte [skip ci] : il ne doit pas relancer ce workflow.
      - name: Publish to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all docs
          if git diff --cached --quiet; then
            echo 'Build identique à la version publiée, rien à déployer.'
            exit 0
          fi
          git commit -m "chore: déploie ${GITHUB_SHA::7} sur GitHub Pages [skip ci]"
          git push origin HEAD:main
