name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer la publication à la main depuis l'onglet Actions.
  workflow_dispatch:

# Un nouveau push sur une branche annule l'exécution encore en cours pour cette
# branche, sauf sur main où le déploiement qui suit ne doit pas être interrompu.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # `pages` publie le site, `id-token` signe l'artefact remis à GitHub Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le build écrit dans docs/ avec le base href du site publié ; le
      # postbuild recopie index.html en 404.html pour les liens profonds, et
      # robots.txt, sitemap.xml et llm.txt suivent comme assets d'angular.json.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
