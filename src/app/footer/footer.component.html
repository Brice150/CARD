<footer>
  <div class="inner">
    <div class="identity">
      <strong>{{ enterprise.titleFront }}</strong>
      <span>Société civile immobilière familiale · Caen, Normandie</span>
      <span>R.C.S Caen · SIRET 983 377 037 00012</span>
    </div>
    <div class="links">
      <button
        type="button"
        class="copy"
        [appCopyText]="enterprise.email"
        appCopyLabel="Adresse e-mail copiée"
        #copyEmail="appCopyText"
        aria-label="Copier l’adresse e-mail"
      >
        <i
          class="bx"
          [class.bxs-envelope]="!copyEmail.copied()"
          [class.bx-check]="copyEmail.copied()"
          aria-hidden="true"
        ></i>
        {{ enterprise.email }}
      </button>
      <a routerLink="/contact">
        <i class="bx bxs-message-dots" aria-hidden="true"></i>
        Formulaire de contact
      </a>
    </div>
  </div>
  <p class="copyright">
    © {{ year }} Lecomte Investments. Tous droits réservés.
  </p>
</footer>
