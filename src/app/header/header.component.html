<header>
  <a class="brand" routerLink="/home" title="Accueil">
    <img
      [src]="imagePath + 'Logo.webp'"
      alt=""
      width="40"
      height="40"
      decoding="async"
    />
    <span class="brand-text">
      <strong>Lecomte</strong>
      <small>Investments</small>
    </span>
  </a>
  <nav aria-label="Navigation principale">
    <a
      routerLink="/home"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      title="Accueil"
    >
      <i class="bx bxs-home" aria-hidden="true"></i>
      <span>Accueil</span>
    </a>
    <a
      routerLink="/about"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      title="À Propos"
    >
      <i class="bx bxs-building-house" aria-hidden="true"></i>
      <span>À propos</span>
    </a>
    <a
      routerLink="/contact"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      title="Contact"
    >
      <i class="bx bxs-envelope" aria-hidden="true"></i>
      <span>Contact</span>
    </a>
  </nav>
</header>
